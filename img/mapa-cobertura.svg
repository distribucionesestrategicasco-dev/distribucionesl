<title id="t">Cobertura de entregas en la Costa Caribe</title>
<desc id="d">Mapa: despachos desde Barranquilla, entrega el mismo día en Barranquilla y su área metropolitana; 24 a 48 horas a Cartagena, Santa Marta y Valledupar; 48 a 72 horas a Montería.</desc>
